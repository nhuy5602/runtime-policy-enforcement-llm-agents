name: Verify research artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON fixtures
        run: |
          python -m json.tool experiments/fixtures/policy_v1.json > /dev/null
          python -m json.tool experiments/fixtures/cases_v1.json > /dev/null
      - name: Check simulator syntax
        run: |
          python -m py_compile experiments/policy_guard_sim.py
      - name: Run policy conformance self test
        run: |
          python experiments/policy_guard_sim.py --self-test --output /tmp/policy_guard_results.json
          python -m json.tool /tmp/policy_guard_results.json > /dev/null
      - name: Run scorer and paired-statistics regression tests
        run: |
          python -m unittest discover -s experiments -p 'test_*.py' -v
      - name: Run adapter attestation self test
        run: |
          python experiments/adapter_attestation.py --self-test --output /tmp/adapter_attestation.json
          python -m json.tool /tmp/adapter_attestation.json > /dev/null
      - name: Run locked benchmark split smoke test
        run: |
          python experiments/offline_benchmark_harness.py --self-test --split test \
            --output-dir /tmp/benchmark_test --seed 20260926 --bootstrap 100
